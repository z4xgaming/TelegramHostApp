plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.telegramhost'
    compileSdk 34

    defaultConfig {
        applicationId "com.z4x.telegramhost"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // 32-bit phone support
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TelegramHost-v${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        buildPython("python3")
        pip {
            // ✅ SAFE libraries (crash nahi karti)
            install "python-telegram-bot==20.7"
            install "requests"
            install "aiohttp"
            install "PyJWT"
            install "python-dotenv"
            install "pytz"
            install "python-dateutil"
            install "sqlalchemy"
            install "aiosqlite"
            install "colorama"
            install "emoji"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
